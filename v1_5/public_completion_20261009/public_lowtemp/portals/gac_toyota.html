<body>
    
     <section id="home" v-cloak>

    <script>
        Vue.use(httpVueLoader);
        Vue.directive('up', {
            bind: function (el, bs, vn) {
                let [eventType, eventCodeName, eventData = {}] = bs.value;

                el.addEventListener('click', () => {
                    Tool.sendEventPoint(eventType, eventData, eventCodeName)
                });
            },
        });
        new Vue({
            el: '#home',
            components: {
                'cookie': httpVueLoader(`/2022/src/components/nav/cookie.vue?v=${_process.version}`),
                'nav-footer': httpVueLoader(`/2022/src/components/nav/footer.vue?v=${_process.version}`),
                'common-header': httpVueLoader(`/2022/src/components/nav/header.vue?v=${_process.version}`),
                'tool-right': httpVueLoader(`/2022/src/components/nav/tool-right.vue?v=${_process.version}`),
                'common-module': httpVueLoader(`/2022/src/components/nav/common-module.vue?v=${_process.version}`),
                'graphic-code': httpVueLoader(`/2022/src/components/modules/graphic-code.vue?v=${_process.version}`),
                'drive-form': httpVueLoader(`/2022/src/components/modules/drive-form.vue?v=${_process.version}`),
                'banner-list': httpVueLoader(`/2022/src/home/components/banner-list.vue?v=${_process.version}`),
                'car-list': httpVueLoader(`/2022/src/home/components/car-list.vue?v=${_process.version}`),
                'page-image': httpVueLoader(`/2022/src/home/components/page-image.vue?v=${_process.version}`),
                'active-list': httpVueLoader(`/2022/src/home/components/active-list.vue?v=${_process.version}`),
                'page-other': httpVueLoader(`/2022/src/home/components/page-other.vue?v=${_process.version}`),
            },
            data() {
                return {
                    localdata: null,
                    activeJson: null,
                    timer:null,
                    bodySwiper:null,
                    isRange:false,//关于直播范围
                    isTopH:false,
                    isZIndex:false,
                    selectedIndex:-1,
                    indexPage:0,
                    isCodeShow: false,//手机验证码
          			codeStatus:'',//图像验证码状态
					phoneCode:'',//验证码手机号码
                    startScroll: 0,
                    touchStart: 0,
                    touchCurrent: 0,
                    touchTime:null,
                };
            },
            watch: {
            },
            methods: {
                smsResult(key,phone,status){
					this.isCodeShow = key;
					this.phoneCode = phone || null;
					this.codeStatus = status || '';
				},
				// 通过验证后，需要自行隐藏模态框
				onSuccess(msg){
                    this.isCodeShow = false;
                    this.codeStatus = 'open';
				},
				// 用户点击遮罩层，应该关闭模态框
				onClose(){
				    this.isCodeShow = false;
				},
                changetop(data){
                    this.isTopH = data
                },
                // 滚动到指定屏幕
				toPageHomeIndex(page,carName) {
                    let index = 0;
                    if(page){
                        let windowHeight = window.innerHeight || document.documentElement.clientHeight
					    let offsetTop = document.getElementById(page)?.offsetTop
                        index = Math.round(offsetTop/windowHeight)
                    }
					_swiper.bodySwiper.enable()
					_swiper.bodySwiper.slideTo(index,0)
                    if(carName){
                        this.selectedIndex = _baseData.modleJson.findIndex(item => item.enname == carName)
                    }
				},
                initSwiper() {
                    let _this = this
                    //全屏效果
                    _swiper.bodySwiper = new Swiper('.bodySwiper', {
                        roundLengths : true,
                        mousewheel: !device.isMobileOrTablet,
                        allowTouchMove: device.isMobileOrTablet,
                        direction: 'vertical',
                        observer: true,
                        observeParents: true,
                        speed: 700,
                        preloadImages: false,
                        noSwiping: true, // 启用不可滑动功能
                        noSwipingClass : 'scroll-box',
                        on: {
                            init() {
                            },
                            slideChange() {
                                _this.indexPage = this.activeIndex
                            },
                            slideNextTransitionStart() {
                                if(this.isEnd){
                                    _swiper.bodySwiper.disable();
                                }
							},
                        },
                    })
                },
                handleWheel (event) {
					event.stopPropagation();
					let isUpWheel = event.deltaY < 0
                    if(_swiper.bodySwiper.enabled) return
					//是否开启切换
					let index = this.indexPage
                    let slide = _swiper.bodySwiper.slides[index]
                    let slideTop = slide.scrollTop
                    if(isUpWheel && slideTop == 0){
                        _swiper.bodySwiper.enable();
                    }
				},
                handleTouchStart(e){
                    if(!device.isMobileOrTablet) return false
                    this.startScroll = this.$refs.swiperScroll.scrollTop;
                    this.touchStart = e.targetTouches[0].pageY;
                },
                handleTouchMove(e){
                    if(!device.isMobileOrTablet) return false
                    this.touchCurrent = e.targetTouches[0].pageY;
                    const touchesDiff = this.touchCurrent - this.touchStart;
                    const slide = this.$refs.swiperScroll;
                    const onlyScrolling = 
                        (slide.scrollHeight > slide.offsetHeight) && (
                        (touchesDiff < 0 && this.startScroll === 0) ||
                        (touchesDiff > 0 && this.startScroll === (slide.scrollHeight - slide.offsetHeight)) ||
                        (this.startScroll > 0 && this.startScroll < (slide.scrollHeight - slide.offsetHeight))
                        );
                    
                    if (onlyScrolling) {
                        e.stopPropagation();
                    }
                },
                handleTouchEnd(e){
                    if(!device.isMobileOrTablet) return false
                    this.listenSlidingCore();
                },
                listenSlidingCore(){
                    const slide = this.$refs.swiperScroll;
                    const top = slide.scrollTop;
                    const h = slide.offsetHeight;
                    const h1 = slide.querySelector('.page-height').offsetHeight;
                    
                    if (this.touchTime) clearTimeout(this.touchTime);
                    
                    this.touchTime = setTimeout(() => {
                        if (top === slide.scrollTop) {
                            if ((h1 - h - top < 5 && h + top - h1 <= 5)) {
                                _swiper.bodySwiper.disable();
                            } else {
                                _swiper.bodySwiper.enable();
                            }
                        } else {
                            this.listenSlidingCore();
                        }
                    }, 20);
                },
                // 初始化
                async getData() {
                    window._swiper = {};
                    _baseData.modleJson = _baseData.carModleJson
                    _baseData.proJson = await _api.GetProCityInfo();
                    _baseData.dealerJson = await _api.GetDealerInfo();

                    localMap.getLocation().then((res) => {
                        let nearData = localMap.selectedNearest(res.lat, res.lnt, _baseData.dealerJson)
                        this.localdata = {
                            nearData: nearData,
                            province: nearData ? nearData.Province : res.province,
                            city: nearData ? nearData.City : res.city,
                            lat: res.lat,
                            lnt: res.lnt,
                        }
                    })
                    //活动数据
                    _api.getActivityList().then(({data:res}) => {
                        //stauts图片 4 未开始  3 已结束 2进行中  1 直播中  5回放中
                        //live  0/'’是活动  1是慢直播  2是直播 3是回放
                        this.activeJson = res.slice(0, 4).map(item => {
                            const isStart = item.startTime ? !Tool.compareTime(item.startTime) : true;
                            const isEnd = item.endTime ? !Tool.compareTime(item.endTime) : false;
                            let status = 'ended'
                            if(item.live == 1 || (item.live == 2 && isStart && !isEnd)){
                                status = 'live'
                            }else if(item.live == 3){
                                status = 'playback'
                            }else if(!isStart){
                                status = 'unStart'
                            }else if(!isEnd){
                                status = 'starting'
                            }
                            return {
                                ...item,
                                isStart,
                                isEnd,
                                status
                            };
                        });
                    });
                },
                updateIsRange() {
                    this.isRange = new Date().getHours() >= 9 && new Date().getHours() < 21;
                },
            },
            async beforeMount(){
                await this.getData(); //基本数据
            },
            mounted() {
                Tool.getHeight();
                this.initSwiper();
                // this.updateIsRange();
                // // 每分钟检查一次
                // this.timer = setInterval(() => {
                //     this.updateIsRange();
                // }, 60000); 
                // 鼠标事件
				document.addEventListener('wheel', Tool.throttle((event) => { this.handleWheel(event) }, 400))
            },
            beforeDestroy() { 
                if (this.timer) clearInterval(this.timer);
            },
        });
    </script>
